name: State Farm Insurance Companies
description: >-
  State Farm Insurance Companies is the collective name for the group of insurance subsidiaries operating under State
  Farm Mutual Automobile Insurance Company, the parent organization headquartered in Bloomington, Illinois. The group
  comprises fourteen property and casualty insurance companies and two life insurance companies including State Farm
  Mutual Automobile Insurance Company, State Farm Fire and Casualty Company, State Farm Indemnity Company, State Farm
  Life Insurance Company, State Farm General Insurance Company, State Farm Florida Insurance Company, and State Farm
  Lloyds, among others. This multi-entity structure allows State Farm to manage its business across different US state
  regulatory environments. As a group, State Farm Insurance Companies is the largest property and casualty insurer in
  the United States. The group shares the common digital infrastructure and developer platform operated at
  developer.statefarm.com.
apis:
- aid: state-farm-insurance-cos:partner-gateway-api
  name: Partner Gateway API
  description: >-
    The State Farm Partner Gateway API serves as the unified integration layer for all State Farm Insurance
    Companies subsidiaries, enabling external partners to access insurance products across the State Farm
    family of companies through a single API entry point. The Partner Gateway supports embedded insurance
    workflows, lender integrations, real estate platforms, and third-party aggregators, routing requests
    to the appropriate State Farm subsidiary based on the product type and state jurisdiction.
  humanURL: https://developer.statefarm.com
  baseURL: https://api.statefarm.com/v1
  tags:
  - Insurance
  - Partner
  - Integration
  - API Gateway
  - Multi-line
  properties:
